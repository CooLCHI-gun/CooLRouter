<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 520" width="1150" height="520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="CooLRouter routing — one request, one tier">
<title>CooLRouter routing — one request, one tier</title>
<desc>one tier per request, behind a fail-closed guard that never touches the payload</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><polygon points="0 0, 8 4.5, 0 9" fill="#64748b"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern></defs>
<rect x="0" y="0" width="1150" height="520" fill="#020617"/>
<rect x="0" y="0" width="1150" height="520" fill="url(#grid)"/>
<text x="60" y="48" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f1f5f9" font-weight="700" letter-spacing="-0.5">CooLRouter routing — one request, one tier</text>
<text x="60" y="72" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8">POST /v1/chat/completions in, one tier out, guard first</text>
<rect x="60" y="110" width="300" height="92" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3"/>
<text x="76" y="145" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0" font-weight="700">client</text>
<text x="76" y="168" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8">POST /v1/chat/completions</text>
<text x="76" y="186" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#64748b">messages[] passed through untouched</text>
<rect x="430" y="110" width="360" height="92" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3"/>
<text x="446" y="145" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0" font-weight="700">PRIVATE-FIRST guard</text>
<text x="446" y="168" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#fb7185">fail-closed: forced-local failure → HTTP 503</text>
<text x="446" y="186" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#fb7185">never falls back to cloud</text>
<rect x="860" y="110" width="230" height="92" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="876" y="140" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8">one file</text>
<text x="876" y="162" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">1150 lines, stdlib only</text>
<text x="876" y="184" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#34d399">11/11 conformance, 7/7 P0</text>
<path d="M 360 156 L 425 156" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 790 156 L 855 156" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="60" y="250" width="1030" height="210" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3"/>
<text x="80" y="278" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#22d3ee" font-weight="700">exactly ONE tier per request</text>
<rect x="80" y="300" width="150" height="78" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="155" y="335" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0" text-anchor="middle" font-weight="700">local</text>
<text x="155" y="358" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8" text-anchor="middle">gemma3:4b</text>
<rect x="245" y="300" width="150" height="78" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="320" y="335" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0" text-anchor="middle" font-weight="700">flash</text>
<text x="320" y="358" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8" text-anchor="middle">cloud flash</text>
<rect x="410" y="300" width="150" height="78" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="485" y="335" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0" text-anchor="middle" font-weight="700">meta</text>
<text x="485" y="358" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8" text-anchor="middle">cloud meta</text>
<rect x="575" y="300" width="150" height="78" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="650" y="335" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0" text-anchor="middle" font-weight="700">vision</text>
<text x="650" y="358" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8" text-anchor="middle">qwen3-vl</text>
<rect x="740" y="300" width="150" height="78" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="815" y="335" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0" text-anchor="middle" font-weight="700">voice</text>
<text x="815" y="358" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8" text-anchor="middle">edge-tts</text>
<rect x="905" y="300" width="150" height="78" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="980" y="335" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0" text-anchor="middle" font-weight="700">research</text>
<text x="980" y="358" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8" text-anchor="middle">sonar-pro</text>
<path d="M 198 202 L 198 245" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 610 202 L 610 245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="80" y="440" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8">Routing is arithmetic + guards, not a second model call.</text>
<text x="80" y="462" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#94a3b8">The client's prompt prefix is never rewritten, so a prefix cache keeps paying.</text>
<text x="80" y="484" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#64748b">Everything here was measured on one laptop; limits are listed in the README.</text>
</svg>
