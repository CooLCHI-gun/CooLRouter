  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="44" y="52" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="start" letter-spacing="-0.5">CooLRouter — The Architecture of Deliberate Delegation</text>
  <text x="44" y="76" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="start">Where intuition is entrusted to a machine — and where it is not. Intent-guided 6-tier routing.</text>
  <rect x="44" y="150" width="200" height="70" rx="10" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="144.0" y="183.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">User Request</text>
  <text x="144.0" y="205.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">chat / CLI / cron</text>
  <rect x="344" y="150" width="200" height="70" rx="10" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="444.0" y="183.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Tier Router</text>
  <text x="444.0" y="205.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">intent-guided · local-first</text>
  <rect x="60" y="300" width="130" height="104" rx="10" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.5"/>
  <text x="125.0" y="336.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Tier 0 · Local</text>
  <text x="125.0" y="358.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">on-device · $0</text>
  <text x="125.0" y="376.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">private</text>
  <rect x="206" y="300" width="130" height="104" rx="10" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="271.0" y="336.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Tier 1 · Cloud</text>
  <text x="271.0" y="358.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">frontier · metered</text>
  <text x="271.0" y="376.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">reasoning</text>
  <rect x="352" y="300" width="130" height="104" rx="10" fill="rgba(59,7,100,0.35)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="417.0" y="336.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Tier 2 · Research</text>
  <text x="417.0" y="358.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">RAG · citations</text>
  <text x="417.0" y="376.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">grounded</text>
  <rect x="498" y="300" width="130" height="104" rx="10" fill="rgba(190,24,60,0.35)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="563.0" y="336.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Tier 3 · Trend</text>
  <text x="563.0" y="358.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">real-time · web</text>
  <text x="563.0" y="376.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">fresh</text>
  <rect x="644" y="300" width="130" height="104" rx="10" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
