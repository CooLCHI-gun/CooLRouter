  <text x="709.0" y="358.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">autonomous · multi-step</text>
  <text x="709.0" y="376.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">orchestration</text>
  <rect x="790" y="300" width="130" height="104" rx="10" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="855.0" y="336.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Tier 5 · Critique</text>
  <text x="855.0" y="358.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">self-eval · review</text>
  <text x="855.0" y="376.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">guardrail</text>
  <rect x="60" y="452" width="843" height="42" rx="10" fill="rgba(136,19,55,0.28)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="481.5" y="477.0" fill="#e2e8f0" font-size="11" font-weight="700" text-anchor="middle">Cognitive Guardrail: multimodal vision · triangulate 2+ sources · never trust self-report</text>
  <rect x="60" y="530" width="843" height="86" rx="10" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="481.5" y="557.0" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">Agent Runtime</text>
  <text x="481.5" y="579.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">orchestrates skills · memory · npx/pip tools · cron · plugins</text>
  <text x="481.5" y="597.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">verify-before-trust · fail-forward</text>
  <rect x="60" y="672" width="260" height="112" rx="10" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="190.0" y="712.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Skill Library</text>
  <text x="190.0" y="734.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">procedural memory</text>
  <text x="190.0" y="752.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">loaded on relevance · patched</text>
  <rect x="352" y="672" width="260" height="112" rx="10" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="482.0" y="712.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Tool Client</text>
  <text x="482.0" y="734.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">MCP servers · npx / pip</text>
  <text x="482.0" y="752.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">sandboxed install · scoped</text>
  <rect x="644" y="672" width="260" height="112" rx="10" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.5"/>
  <text x="774.0" y="712.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Persistent Memory</text>
  <text x="774.0" y="734.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">durable facts only</text>
  <text x="774.0" y="752.0" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">compressed when full</text>
  <rect x="60" y="812" width="843" height="62" rx="10" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="481.5" y="841.0" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Verified Output</text>
  <text x="481.5" y="863.0" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">real artifact + tool output — never plausible prose</text>
