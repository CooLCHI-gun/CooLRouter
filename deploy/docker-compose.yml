# CooLRouter — compose file.
#
#   cp deploy/.env.example .env && docker compose -f deploy/docker-compose.yml up --build
#
# host.docker.internal lets the container reach an Ollama running on the host, which is what makes
# the local tier work from inside a container on Docker Desktop (macOS / Windows).
services:
  coolrouter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ROUTER_OLLAMA_URL: ${ROUTER_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/logs
    restart: unless-stopped
